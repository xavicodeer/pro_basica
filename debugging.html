<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ookini - Reservar</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Reservar en Ookini</h1>
  <label for="cantidad">¿Cuántas tazas quieres reservar?</label>
  <input type="number" id="cantidad">
  <button id="reservar">Reservar</button>

  <script>
    function puedeReservar(valorInput, stockDiarioRestante) {
  // 1. Validar si está vacío o es nulo/indefinido
  if (valorInput === null || valorInput === undefined || valorInput.toString().trim() === "") {
    return { valido: false, mensaje: "El campo no puede estar vacío." };
  }

  // 2. Limpiar espacios en blanco
  const valorLimpio = valorInput.toString().trim();

  // 3. Validar que contenga ÚNICAMENTE dígitos numéricos enteros positivos.
  // Expresión regular que rechaza letras, símbolos, signos negativos (-), puntos decimales (.) y el cero (0).
  const esEnteroPositivo = /^[1-9]\d*$/.test(valorLimpio);

  if (!esEnteroPositivo) {
    // Validaciones específicas para dar un mensaje más claro al usuario
    if (isNaN(Number(valorLimpio))) {
      return { valido: false, mensaje: "Por favor, ingresa solo números válidos (no se permiten letras ni símbolos)." };
    }
    
    const numero = Number(valorLimpio);
    
    if (numero < 0) {
      return { valido: false, mensaje: "No se permiten números negativos." };
    }
    if (numero === 0) {
      return { valido: false, mensaje: "Debes reservar al menos 1 taza." };
    }
    if (!Number.isInteger(numero)) {
      return { valido: false, mensaje: "Por favor, ingresa un número entero de tazas." };
    }
  }

  // Convertimos a número entero de forma segura una vez pasada la validación de formato
  const cantidad = parseInt(valorLimpio, 10);

  // 4. Regla de negocio de Ookini: Máximo 2 tazas por persona
  if (cantidad > 2) {
    return { valido: false, mensaje: "Solo puedes reservar un máximo de 2 tazas por persona." };
  }

  // 5. Validación contra el stock diario disponible (50 tazas en total)
  if (cantidad > stockDiarioRestante) {
    return { valido: false, mensaje: `No hay suficientes tazas disponibles hoy. Quedan ${stockDiarioRestante} disponibles.` };
  }

  // Si pasa todas las validaciones
  return { valido: true, cantidadNumerica: cantidad };
}

// --- Implementación con tu DOM ---
const input = document.querySelector("#cantidad");
const boton = document.querySelector("#reservar");

// Simulación de tazas restantes en el día (esto vendría de tu backend o estado global)
let tazasRestantesHoy = 50; 

boton.addEventListener("click", function (event) {
  event.preventDefault(); // Evita recargar la página si está dentro de un formulario

  const valorIngresado = input.value;
  console.log("El valor crudo es:", valorIngresado); 
  console.log("El tipo es:", typeof valorIngresado);

  // Evaluamos usando nuestra función robusta
  const resultadoValidacion = puedeReservar(valorIngresado, tazasRestantesHoy);

  if (resultadoValidacion.valido) {
    // Descontamos del stock simulado
    tazasRestantesHoy -= resultadoValidacion.cantidadNumerica;
    alert(`¡Reserva confirmada por ${resultadoValidacion.cantidadNumerica} taza(s)!`);
    console.log("Stock restante actualizado:", tazasRestantesHoy);
  } else {
    // Mostramos el error específico que arrojó la validación
    alert(`Error: ${resultadoValidacion.mensaje}`);
  }
});
  </script>
</body>

</html>
